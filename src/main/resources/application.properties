spring.application.name=gestetud
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestetud?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${PORT:8080}
spring.jpa.defer-datasource-initialization=true
integrations.exam-api.base-url=${EXAM_API_BASE_URL:http://localhost:8080/mock-exam-api}
integrations.exam-api.enabled=${EXAM_API_ENABLED:true}
integrations.exam-api.connect-timeout-ms=${EXAM_API_CONNECT_TIMEOUT_MS:2000}
integrations.exam-api.read-timeout-ms=${EXAM_API_READ_TIMEOUT_MS:3000}
