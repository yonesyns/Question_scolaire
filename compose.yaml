services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gestetud
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/gestetud?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      EXAM_API_BASE_URL: ${EXAM_API_BASE_URL:-http://localhost:8080/mock-exam-api}
      EXAM_API_ENABLED: ${EXAM_API_ENABLED:-true}
      EXAM_API_CONNECT_TIMEOUT_MS: ${EXAM_API_CONNECT_TIMEOUT_MS:-2000}
      EXAM_API_READ_TIMEOUT_MS: ${EXAM_API_READ_TIMEOUT_MS:-3000}
    ports: ["8080:8080"]
volumes:
  mysql_data:
