services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gestetud
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/gestetud?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
    ports: ["8080:8080"]
volumes:
  mysql_data:
